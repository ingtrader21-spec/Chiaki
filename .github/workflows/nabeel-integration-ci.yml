name: NABEEL integration CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "pr/nabeel-*"

permissions:
  contents: read

jobs:
  nabeel-integration:
    name: nabeel-integration
    runs-on: [self-hosted, Linux, X64, codestra-ci, nabeel-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          bash -n docs/scripts/nabeel-chiaki-launch.sh
          test -s docs/NABEEL_CHIAKI.md
          test -s docs/NABEEL_GOVERNANCE.md
